spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration
  application:
    name: creastrix-backend
  datasource:
    url: ${CREASTRIX_DB_URL}
    username: ${CREASTRIX_DB_USERNAME}
    password: ${CREASTRIX_DB_PASSWORD}
  flyway:
    enabled: true
    execute-in-transaction: true
    group: false
    postgresql:
      transactional-lock: false

server:
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: lax
        path: /

creastrix:
  auth:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Console only. Correlation is generated by the server, never copied from request headers.
# Keep framework/SQL DEBUG and TRACE off; diagnostic fields use a closed vocabulary.
logging:
  level:
    root: INFO
    com.creastrix.platform.diagnostics: INFO
  pattern:
    level: "%5p [requestId=%X{requestId:-none}]"
